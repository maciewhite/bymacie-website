<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Custom Pickleball Bag with Name | By Macie</title><style>:root{--ink:#292522;--cream:#fbf7f1;--white:#fffdf9;--muted:#746d67;--line:#e6ddd6}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{background:var(--ink);color:#fff;text-align:center;padding:10px 16px;font-size:12px;letter-spacing:1.3px}nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 6%;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.logo{font-family:Georgia,serif;font-size:25px;letter-spacing:1px}.navlinks{display:flex;gap:22px;font-size:14px}main{max-width:1000px;margin:auto;padding:42px 22px 70px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:start}.photo{background:#fffdf9;border:1px solid var(--line);padding:12px}.photo img{width:100%;max-height:650px;object-fit:contain;display:block}.gallery-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.gallery-controls button,.thumb{border:1px solid var(--line);background:var(--white);padding:8px;cursor:pointer;color:var(--ink)}.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.thumb{width:76px;height:76px;padding:3px}.thumb img{width:100%;height:100%;object-fit:cover}.thumb[aria-current="true"]{outline:2px solid #8d9c85}.info h1{font:40px Georgia,serif;margin:0 0 10px}.price{font-weight:bold;font-size:20px}.desc{color:var(--muted);line-height:1.6}label{display:block;font-size:14px;font-weight:bold;margin:18px 0 7px}select,input,textarea{width:100%;padding:12px;border:1px solid #d8cec5;background:#fffdf9;font:15px Arial;color:var(--ink);border-radius:2px}textarea{min-height:85px;resize:vertical}.btn{display:inline-block;width:100%;margin-top:22px;padding:14px 18px;background:var(--ink);color:white;text-align:center;border:0;font-size:14px;cursor:pointer}.back{display:inline-block;margin-bottom:25px;color:var(--muted);font-size:14px}@media(max-width:700px){.layout{grid-template-columns:1fr;gap:24px}nav{padding:15px 18px}.navlinks{gap:12px;font-size:12px}.logo{font-size:21px}main{padding:28px 16px 50px}.info h1{font-size:34px}}</style></head><body><div class="top">CUSTOM • MADE-TO-ORDER • EMBROIDERED BY MACIE</div><nav><a class="logo" href="index.html">By Macie</a><div class="navlinks"><a href="shop.html">Shop</a><a href="index.html#custom">Custom</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav><main><a class="back" href="shop.html">← Back to shop</a><div class="layout"><div class="photo"><div class="gallery-main"><img id="main-pickle-photo" src="pickleball-bag.jpg" alt="Custom embroidered pickleball bag with name"></div>
<div class="gallery-controls"><button type="button" onclick="changePicklePhoto(-1)">← Previous</button><span id="pickle-photo-count">1 of 2</span><button type="button" onclick="changePicklePhoto(1)">Next →</button></div>
<div class="thumbs"><button class="thumb" type="button" onclick="showPicklePhoto(0)" aria-current="true" aria-label="View pickleball bag"><img src="pickleball-bag.jpg" alt=""></button><button class="thumb" type="button" onclick="showPicklePhoto(1)" aria-current="false" aria-label="View bag color chart"><img src="bag-color-chart.png" alt=""></button></div></div><section class="info"><h1>Custom Pickleball Bag with Name</h1><div class="price">$35</div><p class="desc">Choose your bag options and enter the name or wording you would like embroidered.</p><form action="order.html" method="get"><input type="hidden" name="product" value="Custom Pickleball Bag with Name"><label for="bag_color">Bag color</label><select id="bag_color" name="bag_color" required><option value="">Choose bag color</option><option>White</option><option>Black</option><option>Navy</option><option>Pink</option><option>Green</option><option>Custom color</option></select><label for="stitch_color">Stitch color</label><select id="stitch_color" name="stitch_color" required><option value="">Choose stitch color</option><option>Green</option><option>Pink</option><option>Purple</option><option>Navy</option><option>Black</option><option>White</option><option>Gold</option><option>Custom color</option></select><label for="personalization">Personalization</label><select id="personalization" name="personalization" required><option value="">Choose personalization</option><option>Name</option><option>Custom writing</option></select><label for="wording">Name or wording</label><textarea id="wording" name="wording" placeholder="Enter the name or wording you want embroidered"></textarea><label for="extra_notes">Additional notes</label><textarea id="extra_notes" name="extra_notes" placeholder="Any other details (optional)"></textarea><button class="btn" type="submit">Continue to Order</button></form></section></div></main><script>
const picklePhotos=[{src:'pickleball-bag.jpg',alt:'Custom embroidered pickleball bag with name'},{src:'bag-color-chart.png',alt:'By Macie tote bag color chart showing available bag colors'}];
let picklePhoto=0;
function showPicklePhoto(i){picklePhoto=(i+picklePhotos.length)%picklePhotos.length;const img=document.getElementById('main-pickle-photo');img.src=picklePhotos[picklePhoto].src;img.alt=picklePhotos[picklePhoto].alt;document.getElementById('pickle-photo-count').textContent=(picklePhoto+1)+' of '+picklePhotos.length;document.querySelectorAll('.thumb').forEach((b,j)=>b.setAttribute('aria-current',j===picklePhoto?'true':'false'));}
function changePicklePhoto(d){showPicklePhoto(picklePhoto+d);}
</script></body></html>
